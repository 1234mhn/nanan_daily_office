<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雅思口语闯关练习</title>
    <style>
        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            min-height: calc(100vh - 40px);
        }

        /* ========== 顶部导航栏 ========== */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .progress-container {
            flex: 1;
            max-width: 400px;
            min-width: 200px;
        }

        .progress-text {
            font-size: 14px;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .progress-bar {
            width: 100%;
            height: 24px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            border-radius: 12px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }

        /* ========== 地图页面 ========== */
        .map-view {
            padding: 32px;
        }

        .topic-section {
            margin-bottom: 48px;
        }

        .topic-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 3px solid #667eea;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topic-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .level-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .level-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .level-card:hover::before {
            transform: scaleX(1);
        }

        .level-card:hover {
            border-color: #667eea;
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.2);
        }

        .level-card.locked {
            background: #f9fafb;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .level-card.locked:hover {
            transform: none;
            box-shadow: none;
            border-color: #e5e7eb;
        }

        .level-card.completed {
            border-color: #22c55e;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        }

        .level-card.current {
            border-color: #667eea;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .level-number {
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
        }

        .level-status {
            font-size: 24px;
        }

        .level-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .level-subtitle {
            font-size: 14px;
            color: #6b7280;
        }

        /* ========== 关卡页面 ========== */
        .quest-view {
            padding: 32px;
            display: none;
        }

        .quest-view.active {
            display: block;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f3f4f6;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }

        .back-button:hover {
            background: #e5e7eb;
        }

        .quest-header {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            padding: 28px;
            border-radius: 12px;
            margin-bottom: 24px;
            border-left: 4px solid #667eea;
        }

        .part-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .question-en {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .question-zh {
            font-size: 16px;
            color: #6b7280;
            font-style: italic;
        }

        /* ========== 折叠区域 ========== */
        .collapsible-section {
            margin-bottom: 24px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }

        .collapsible-header {
            background: #f9fafb;
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #374151;
            transition: background 0.2s;
        }

        .collapsible-header:hover {
            background: #f3f4f6;
        }

        .collapsible-header .icon {
            transition: transform 0.3s;
            font-size: 20px;
        }

        .collapsible-section.open .collapsible-header .icon {
            transform: rotate(180deg);
        }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .collapsible-section.open .collapsible-content {
            max-height: 2000px;
        }

        .collapsible-inner {
            padding: 20px;
            background: white;
        }

        .ideas-list {
            list-style: none;
        }

        .ideas-list li {
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            align-items: start;
            gap: 12px;
        }

        .ideas-list li:last-child {
            border-bottom: none;
        }

        .ideas-list .bullet {
            color: #667eea;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }

        .idea-content {
            flex: 1;
        }

        .idea-en {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .idea-zh {
            font-size: 13px;
            color: #6b7280;
        }

        .sample-text {
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            line-height: 1.8;
        }

        .sample-en {
            color: #1f2937;
            font-size: 15px;
            margin-bottom: 16px;
        }

        .sample-zh {
            color: #6b7280;
            font-size: 14px;
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }

        /* ========== 计时器 ========== */
        .timer-section {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
        }

        .timer-label {
            font-size: 14px;
            font-weight: 600;
            color: #92400e;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer-display {
            font-size: 48px;
            font-weight: 700;
            color: #92400e;
            font-variant-numeric: tabular-nums;
            margin-bottom: 16px;
        }

        .timer-display.warning {
            color: #dc2626;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .timer-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .timer-button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .timer-button.primary {
            background: #92400e;
            color: white;
        }

        .timer-button.primary:hover {
            background: #78350f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(146, 64, 14, 0.3);
        }

        .timer-button.secondary {
            background: white;
            color: #92400e;
            border: 2px solid #92400e;
        }

        .timer-button.secondary:hover {
            background: #fef3c7;
        }

        .timer-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ========== 录音区域 ========== */
        .recording-section {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
        }

        .recording-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-size: 36px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
            margin-bottom: 16px;
        }

        .recording-button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.4);
        }

        .recording-button.recording {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            animation: recording-pulse 1.5s infinite;
        }

        @keyframes recording-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .recording-label {
            font-size: 14px;
            font-weight: 600;
            color: #1e40af;
            margin-top: 12px;
        }

        .audio-player {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        audio {
            width: 100%;
            border-radius: 8px;
        }

        /* ========== 自评按钮 ========== */
        .complete-section {
            text-align: center;
            padding: 32px;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border-radius: 12px;
            border: 2px dashed #22c55e;
        }

        .complete-button {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 16px 48px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 16px rgba(34, 197, 94, 0.3);
        }

        .complete-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(34, 197, 94, 0.4);
        }

        .complete-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            .container {
                border-radius: 0;
                min-height: 100vh;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .map-view, .quest-view {
                padding: 20px;
            }

            .levels-grid {
                grid-template-columns: 1fr;
            }

            .question-en {
                font-size: 20px;
            }

            .timer-display {
                font-size: 36px;
            }

            .progress-container {
                width: 100%;
            }
        }

        /* ========== 工具类 ========== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="header">
            <h1>🎯 雅思口语闯关练习</h1>
            <div class="progress-container">
                <div class="progress-text" id="progressText">已通过 0 / 24 关</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
                </div>
            </div>
        </div>

        <!-- 地图页面 -->
        <div class="map-view" id="mapView">
            <!-- 通过 JavaScript 动态生成 -->
        </div>

        <!-- 关卡页面 -->
        <div class="quest-view" id="questView">
            <button class="back-button" onclick="showMap()">← 返回地图</button>

            <div class="quest-header">
                <div class="part-badge" id="questPartBadge">Part 1</div>
                <div class="question-en" id="questQuestionEn"></div>
                <div class="question-zh" id="questQuestionZh"></div>
            </div>

            <!-- 提示词折叠区 -->
            <div class="collapsible-section" id="ideasSection">
                <div class="collapsible-header" onclick="toggleCollapsible('ideasSection')">
                    <span>💡 提示词与思路 (Ideas & Keywords)</span>
                    <span class="icon">▼</span>
                </div>
                <div class="collapsible-content">
                    <div class="collapsible-inner">
                        <ul class="ideas-list" id="ideasList"></ul>
                    </div>
                </div>
            </div>

            <!-- 计时器 -->
            <div class="timer-section">
                <div class="timer-label" id="timerLabel">准备时间</div>
                <div class="timer-display" id="timerDisplay">00:30</div>
                <div class="timer-controls">
                    <button class="timer-button primary" id="timerStartBtn" onclick="startTimer()">开始计时</button>
                    <button class="timer-button secondary" id="timerResetBtn" onclick="resetTimer()">重置</button>
                </div>
            </div>

            <!-- 录音区 -->
            <div class="recording-section">
                <button class="recording-button" id="recordBtn" onclick="toggleRecording()">🎤</button>
                <div class="recording-label" id="recordLabel">点击开始录音</div>
                <div class="audio-player" id="audioPlayerContainer"></div>
            </div>

            <!-- 示范答案折叠区 -->
            <div class="collapsible-section" id="sampleSection">
                <div class="collapsible-header" onclick="toggleCollapsible('sampleSection')">
                    <span>📖 示范答案 (Sample Answer)</span>
                    <span class="icon">▼</span>
                </div>
                <div class="collapsible-content">
                    <div class="collapsible-inner">
                        <div class="sample-text">
                            <div class="sample-en" id="sampleEn"></div>
                            <div class="sample-zh" id="sampleZh"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 自评过关 -->
            <div class="complete-section">
                <button class="complete-button" onclick="completeQuest()">✅ 我练熟了 → 过关</button>
            </div>
        </div>
    </div>

    <script>
        /* ========================================================================
           如何加新题：
           1. 在下方 questData 数组中添加新的主题对象
           2. 每个主题包含：title（标题）、titleEn（英文标题）、part（Part类型）、levels（关卡数组）
           3. 每个关卡包含：
              - question_en: 英文题目
              - question_zh: 中文翻译
              - type: 'Part1' | 'Part2' | 'Part3'
              - ideas: 思路数组，每项包含 en（英文）和 zh（中文）
              - sample_en: 英文示范答案
              - sample_zh: 中文翻译
           4. 保存后刷新浏览器即可
        ======================================================================== */

        // ========== 数据定义 ==========
        const questData = [
            // 主题 1: Daily Life & Hometown
            {
                title: "日常与家乡",
                titleEn: "Daily Life & Hometown",
                part: "Part 1",
                levels: [
                    {
                        question_en: "Can you describe your hometown?",
                        question_zh: "你能描述一下你的家乡吗？",
                        type: "Part1",
                        ideas: [
                            { en: "Location & geography", zh: "地理位置" },
                            { en: "Population size (big city / small town)", zh: "人口规模（大城市/小镇）" },
                            { en: "Famous for... (food, scenery, history)", zh: "以…闻名（美食、风景、历史）" },
                            { en: "Personal feelings about it", zh: "个人感受" }
                        ],
                        sample_en: "I'm from Chengdu, which is located in southwestern China. It's a large city with over 20 million people. Chengdu is famous for its spicy hotpot and, of course, the giant pandas. The city has a relaxed vibe—people enjoy drinking tea in parks and playing mahjong. I really love the food culture there, and I feel proud to be from such a vibrant place.",
                        sample_zh: "我来自成都，位于中国西南部。这是一个拥有超过2000万人口的大城市。成都以麻辣火锅和大熊猫闻名。这座城市氛围悠闲——人们喜欢在公园喝茶、打麻将。我非常喜欢那里的饮食文化，我为来自这样一个充满活力的地方感到自豪。"
                    },
                    {
                        question_en: "What is your daily routine like?",
                        question_zh: "你的日常作息是怎样的？",
                        type: "Part1",
                        ideas: [
                            { en: "Morning routine (wake up time, breakfast)", zh: "早晨（起床时间、早餐）" },
                            { en: "Work or study schedule", zh: "工作或学习时间表" },
                            { en: "Evening activities", zh: "晚间活动" },
                            { en: "Bedtime", zh: "就寝时间" }
                        ],
                        sample_en: "On weekdays, I usually wake up around 7 a.m. and have a quick breakfast—usually coffee and toast. Then I head to work, where I teach English until about 5 p.m. After work, I might go to the gym or catch up with friends. I try to be in bed by 11 p.m. so I get enough rest. Weekends are much more flexible—I like to sleep in a bit!",
                        sample_zh: "工作日我通常早上7点起床，快速吃个早餐——通常是咖啡和吐司。然后去上班，教英语一直到下午5点左右。下班后，我可能会去健身房或和朋友聚会。我尽量在晚上11点前睡觉以保证充足休息。周末就灵活多了——我喜欢多睡一会儿！"
                    },
                    {
                        question_en: "Do you live in a house or an apartment?",
                        question_zh: "你住在房子还是公寓？",
                        type: "Part1",
                        ideas: [
                            { en: "Type of accommodation", zh: "住所类型" },
                            { en: "Location (city center, suburb)", zh: "位置（市中心、郊区）" },
                            { en: "Favorite room or feature", zh: "最喜欢的房间或特点" },
                            { en: "Pros and cons", zh: "优缺点" }
                        ],
                        sample_en: "I live in an apartment in the city center. It's not very big—just a one-bedroom place—but it's really convenient because everything I need is nearby, like supermarkets and subway stations. My favorite part is the balcony where I can enjoy my morning coffee. The only downside is that it can be a bit noisy sometimes, especially on weekends.",
                        sample_zh: "我住在市中心的一套公寓里。不是很大——只有一间卧室——但非常方便,因为我需要的一切都在附近,比如超市和地铁站。我最喜欢的部分是阳台,我可以在那里享受早晨的咖啡。唯一的缺点是有时会有点吵,特别是在周末。"
                    },
                    {
                        question_en: "How do you usually spend your weekends?",
                        question_zh: "你通常怎么度过周末？",
                        type: "Part1",
                        ideas: [
                            { en: "Relax at home vs. go out", zh: "在家放松 vs. 外出" },
                            { en: "Hobbies or sports", zh: "爱好或运动" },
                            { en: "Social activities with friends/family", zh: "与朋友/家人的社交活动" },
                            { en: "Catch up on sleep or errands", zh: "补觉或做家务" }
                        ],
                        sample_en: "On weekends, I like to have a balance between relaxing and being productive. Saturday mornings, I often go for a run in the park. In the afternoon, I might meet up with friends for brunch or go shopping. Sundays are usually more laid-back—I catch up on reading, watch movies, or prepare lessons for the coming week. It's important for me to recharge before Monday comes around.",
                        sample_zh: "周末我喜欢在放松和高效之间找到平衡。周六早上,我经常去公园跑步。下午,我可能会和朋友一起吃早午餐或去购物。周日通常更悠闲——我会读书、看电影,或为下周的课程做准备。在周一到来之前充电对我来说很重要。"
                    }
                ]
            },
            // 主题 2: Food & Restaurant
            {
                title: "饮食",
                titleEn: "Food & Restaurant",
                part: "Part 1",
                levels: [
                    {
                        question_en: "What is your favorite type of food?",
                        question_zh: "你最喜欢什么类型的食物？",
                        type: "Part1",
                        ideas: [
                            { en: "Cuisine type (Chinese, Italian, Japanese, etc.)", zh: "菜系（中餐、意大利、日本等）" },
                            { en: "Specific dishes you love", zh: "具体喜欢的菜" },
                            { en: "Why you like it (taste, memories)", zh: "为什么喜欢（味道、回忆）" },
                            { en: "How often you eat it", zh: "多久吃一次" }
                        ],

                            { en: "Challenges: digital divide, screen time", zh: "挑战：数字鸿沟、屏幕时间" }
                        ],
                        sample_en: "Technology has enormous potential to improve education. Online platforms like Coursera or Khan Academy make high-quality education accessible to people everywhere, regardless of location or financial situation. Interactive tools, such as educational apps and virtual reality, can make learning more engaging and effective. Technology also allows for personalized learning—students can progress at their own pace. However, there are challenges, such as the digital divide, where not everyone has access to devices or the internet. Additionally, too much screen time can be harmful. Overall, if used wisely, technology can democratize education and make it more effective.",
                        sample_zh: "科技在改善教育方面有巨大潜力。像Coursera或可汗学院这样的在线平台使高质量教育可供世界各地的人使用,无论地点或经济状况如何。教育应用程序和虚拟现实等互动工具可以使学习更具吸引力和有效性。科技还允许个性化学习——学生可以按自己的节奏进步。然而,也存在挑战,如数字鸿沟,并非每个人都能使用设备或互联网。此外,过多的屏幕时间可能有害。总的来说,如果明智使用,科技可以使教育民主化并更有效。"

            // 主题 6: Opinions & Society
            {

                part: "Part 3",
                levels: [

                        ideas: [

                            { en: "Pollution (air, water, plastic)", zh: "污染（空气、水、塑料）" },
                            { en: "Deforestation & loss of biodiversity", zh: "森林砍伐与生物多样性丧失" },
                            { en: "Solutions: renewable energy, policy, individual action", zh: "解决方案：可再生能源、政策、个人行动" }
                        ],
                        sample_en: "I believe the biggest environmental challenges are climate change and pollution. Rising global temperatures are causing extreme weather events, melting ice caps, and threatening ecosystems. Pollution, especially plastic waste in oceans and air pollution in cities, is harming both wildlife and human health. Deforestation is another critical issue, as it reduces biodiversity and contributes to carbon emissions. To tackle these problems, we need a combination of government policies, such as investing in renewable energy, and individual actions, like reducing waste and using public transport. It's a complex issue, but collective effort is essential.",
                        sample_zh: "我认为最大的环境挑战是气候变化和污染。全球气温上升导致极端天气事件、冰盖融化和生态系统受威胁。污染,特别是海洋中的塑料废物和城市中的空气污染,正在危害野生动物和人类健康。森林砍伐是另一个关键问题,因为它减少了生物多样性并导致碳排放。要解决这些问题,我们需要政府政策(如投资可再生能源)和个人行动(如减少废物和使用公共交通)相结合。这是一个复杂的问题,但集体努力至关重要。"
                    },
                    {
                        question_en: "Do you think the education system in your country is effective? Why or why not?",
                        question_zh: "你认为你们国家的教育系统有效吗？为什么？",
                        type: "Part3",
                        ideas: [
                            { en: "Strengths (e.g., strong foundation, discipline)", zh: "优势（如扎实基础、纪律）" },
                            { en: "Weaknesses (e.g., too exam-focused, lack of creativity)", zh: "弱点（如过于注重考试、缺乏创造力）" },
                            { en: "Comparison with other systems", zh: "与其他系统的比较" },
                            { en: "Suggestions for improvement", zh: "改进建议" }
                        ],
                        sample_en: "The education system in my country has both strengths and weaknesses. On the positive side, it provides a strong academic foundation, especially in subjects like math and science, and students are generally disciplined and hardworking. However, the system is very exam-oriented, which puts enormous pressure on students and often stifles creativity and critical thinking. There's less emphasis on soft skills, such as communication or teamwork. Compared to some Western systems, which encourage more independent thinking and project-based learning, ours feels quite rigid. I think we need to strike a better balance—keeping academic rigor while fostering creativity and holistic development.",
                        sample_zh: "我们国家的教育系统既有优势也有弱点。积极方面,它提供了扎实的学术基础,特别是在数学和科学等科目上,学生通常很守纪律和勤奋。然而,系统过于注重考试,这给学生带来巨大压力,往往扼杀了创造力和批判性思维。对沟通或团队合作等软技能的重视较少。与一些鼓励更多独立思考和基于项目的学习的西方系统相比,我们的系统感觉相当僵化。我认为我们需要更好的平衡——在保持学术严谨的同时培养创造力和全面发展。"
                    },
                    {
                        question_en: "Why do you think cultural differences exist between countries?",
                        question_zh: "你认为为什么国家之间存在文化差异？",
                        type: "Part3",
                        ideas: [
                            { en: "Geography & climate", zh: "地理与气候" },
                            { en: "History & traditions", zh: "历史与传统" },
                            { en: "Religion & philosophy", zh: "宗教与哲学" },
                            { en: "Language and communication styles", zh: "语言和交流方式" },
                            { en: "Benefits of cultural diversity", zh: "文化多样性的好处" }
                        ],
                        sample_en: "Cultural differences arise from a variety of factors. Geography and climate play a role—for example, food and clothing traditions often reflect the local environment. History is another major factor; countries with different historical events, such as colonization or revolutions, develop distinct identities. Religion and philosophy also shape values and social norms. Even language influences how people think and communicate. These differences are valuable because they enrich the world with diverse perspectives, art, and traditions. In today's globalized society, understanding and respecting cultural differences is more important than ever for peaceful coexistence.",
                        sample_zh: "文化差异源于多种因素。地理和气候起作用——例如,食物和服装传统通常反映当地环境。历史是另一个主要因素;经历过不同历史事件(如殖民或革命)的国家会发展出独特的身份。宗教和哲学也塑造价值观和社会规范。甚至语言也影响人们的思考和交流方式。这些差异很有价值,因为它们用多样的观点、艺术和传统丰富了世界。在当今全球化社会中,理解和尊重文化差异对和平共处比以往任何时候都更重要。"
                    },
                    {
                        question_en: "How do you think society has changed in the last 20 years?",
                        question_zh: "你认为过去20年社会发生了怎样的变化？",
                        type: "Part3",
                        ideas: [
                            { en: "Technological advancement (smartphones, internet)", zh: "技术进步（智能手机、互联网）" },
                            { en: "Globalization & cultural exchange", zh: "全球化与文化交流" },
                            { en: "Changes in work culture (remote work, gig economy)", zh: "工作文化变化（远程工作、零工经济）" },
                            { en: "Social attitudes (diversity, equality)", zh: "社会态度（多样性、平等）" },
                            { en: "Challenges (inequality, mental health)", zh: "挑战（不平等、心理健康）" }
                        ],
                        sample_en: "Society has changed dramatically in the last 20 years, largely due to technology. Smartphones and the internet have transformed how we communicate, work, and access information. Globalization has increased cultural exchange, making the world feel smaller and more connected. Work culture has also evolved—remote work and the gig economy are now common, offering more flexibility but also less job security. Social attitudes have shifted too; there's greater awareness and acceptance of diversity and equality. However, challenges remain, such as rising inequality and mental health issues linked to modern lifestyles. Overall, it's been a period of rapid change with both benefits and drawbacks.",
                        sample_zh: "过去20年社会发生了巨大变化,主要是由于科技。智能手机和互联网改变了我们的交流、工作和获取信息的方式。全球化增加了文化交流,使世界感觉更小、联系更紧密。工作文化也发生了变化——远程工作和零工经济现在很普遍,提供了更多灵活性但也减少了工作保障。社会态度也发生了转变;对多样性和平等的认识和接受度更高了。然而,挑战依然存在,如不平等加剧和与现代生活方式相关的心理健康问题。总的来说,这是一个快速变化的时期,既有好处也有缺点。"
                    }
                ]
            }
        ];

        // ========== 状态管理 ==========
        const STORAGE_KEY = 'ielts_speaking_quest_v1';
        let completedQuests = loadProgress();
        let currentQuestId = null;
        let timerInterval = null;
        let timerSeconds = 0;
        let timerMode = 'prep'; // 'prep' or 'answer'
        let mediaRecorder = null;
        let audioChunks = [];
        let audioBlob = null;

        // ========== 进度存取 ==========
        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved ? JSON.parse(saved) : [];
        }

        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(completedQuests));
        }

        // ========== 关卡解锁逻辑 ==========
        function isQuestUnlocked(topicIndex, levelIndex) {
            // 第一关默认解锁
            if (topicIndex === 0 && levelIndex === 0) return true;

            // 同主题内：前一关通过才解锁
            if (levelIndex > 0) {
                const prevId = `${topicIndex}-${levelIndex - 1}`;
                return completedQuests.includes(prevId);
            }

            // 新主题：前一主题最后一关必须通过
            if (topicIndex > 0) {
                const prevTopicLastLevel = questData[topicIndex - 1].levels.length - 1;
                const prevId = `${topicIndex - 1}-${prevTopicLastLevel}`;
                return completedQuests.includes(prevId);
            }

            return false;
        }

        function isQuestCompleted(topicIndex, levelIndex) {
            const id = `${topicIndex}-${levelIndex}`;
            return completedQuests.includes(id);
        }

        function isCurrentQuest(topicIndex, levelIndex) {
            // 未完成 + 已解锁 = 当前可打的关
            return !isQuestCompleted(topicIndex, levelIndex) && isQuestUnlocked(topicIndex, levelIndex);
        }

        // ========== 渲染地图 ==========
        function renderMap() {
            const mapView = document.getElementById('mapView');
            mapView.innerHTML = '';

            questData.forEach((topic, topicIndex) => {
                const section = document.createElement('div');
                section.className = 'topic-section';

                const title = document.createElement('div');
                title.className = 'topic-title';
                title.innerHTML = `
                    ${topic.titleEn}
                    <span class="topic-badge">${topic.part}</span>
                `;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'levels-grid';

                topic.levels.forEach((level, levelIndex) => {
                    const card = document.createElement('div');
                    card.className = 'level-card';

                    const unlocked = isQuestUnlocked(topicIndex, levelIndex);
                    const completed = isQuestCompleted(topicIndex, levelIndex);
                    const current = isCurrentQuest(topicIndex, levelIndex);

                    if (!unlocked) {
                        card.classList.add('locked');
                    } else if (completed) {
                        card.classList.add('completed');
                    } else if (current) {
                        card.classList.add('current');
                    }

                    let statusIcon = '🔒';
                    if (completed) statusIcon = '✅';
                    else if (current) statusIcon = '⭐';
                    else if (unlocked) statusIcon = '🎯';

                    card.innerHTML = `
                        <div class="level-header">
                            <div class="level-number">Level ${levelIndex + 1}</div>
                            <div class="level-status">${statusIcon}</div>
                        </div>
                        <div class="level-title">${level.question_en.substring(0, 50)}${level.question_en.length > 50 ? '...' : ''}</div>
                        <div class="level-subtitle">${level.question_zh.substring(0, 40)}${level.question_zh.length > 40 ? '...' : ''}</div>
                    `;

                    if (unlocked) {
                        card.onclick = () => openQuest(topicIndex, levelIndex);
                    }

                    grid.appendChild(card);
                });

                section.appendChild(grid);
                mapView.appendChild(section);
            });

            updateProgressBar();
        }

        // ========== 更新进度条 ==========
        function updateProgressBar() {
            const totalQuests = questData.reduce((sum, topic) => sum + topic.levels.length, 0);
            const completedCount = completedQuests.length;
            const percentage = Math.round((completedCount / totalQuests) * 100);

            document.getElementById('progressText').textContent = `已通过 ${completedCount} / ${totalQuests} 关`;
            const fill = document.getElementById('progressFill');
            fill.style.width = `${percentage}%`;
            fill.textContent = `${percentage}%`;
        }

        // ========== 打开关卡 ==========
        function openQuest(topicIndex, levelIndex) {
            currentQuestId = `${topicIndex}-${levelIndex}`;
            const quest = questData[topicIndex].levels[levelIndex];

            document.getElementById('questPartBadge').textContent = quest.type;
            document.getElementById('questQuestionEn').textContent = quest.question_en;
            document.getElementById('questQuestionZh').textContent = quest.question_zh;

            // 渲染思路
            const ideasList = document.getElementById('ideasList');
            ideasList.innerHTML = '';
            quest.ideas.forEach(idea => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="bullet">•</div>
                    <div class="idea-content">
                        <div class="idea-en">${idea.en}</div>
                        <div class="idea-zh">${idea.zh}</div>
                    </div>
                `;
                ideasList.appendChild(li);
            });

            // 渲染示范答案
            document.getElementById('sampleEn').textContent = quest.sample_en;
            document.getElementById('sampleZh').textContent = quest.sample_zh;

            // 重置折叠区
            document.getElementById('ideasSection').classList.remove('open');
            document.getElementById('sampleSection').classList.remove('open');

            // 重置计时器
            resetTimer();

            // 重置录音
            resetRecording();

            // 切换视图
            document.getElementById('mapView').style.display = 'none';
            document.getElementById('questView').classList.add('active');
        }

        // ========== 返回地图 ==========
        function showMap() {
            document.getElementById('mapView').style.display = 'block';
            document.getElementById('questView').classList.remove('active');
            currentQuestId = null;
            resetTimer();
            resetRecording();
        }

        // ========== 折叠区控制 ==========
        function toggleCollapsible(sectionId) {
            const section = document.getElementById(sectionId);
            section.classList.toggle('open');
        }

        // ========== 计时器 ==========
        function startTimer() {
            if (timerInterval) return; // 已在运行

            const [topicIndex, levelIndex] = currentQuestId.split('-').map(Number);
            const quest = questData[topicIndex].levels[levelIndex];

            if (timerMode === 'prep') {
                // 准备时间
                if (quest.type === 'Part2') {
                    timerSeconds = 60;
                } else {
                    timerSeconds = 30;
                }
                document.getElementById('timerLabel').textContent = '准备时间';
            } else {
                // 回答时间
                if (quest.type === 'Part1') {
                    timerSeconds = 30;
                } else if (quest.type === 'Part2') {
                    timerSeconds = 120;
                } else {
                    timerSeconds = 60;
                }
                document.getElementById('timerLabel').textContent = '回答时间';
            }

            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;

                    if (timerMode === 'prep') {
                        // 准备结束，自动切换到回答计时
                        timerMode = 'answer';
                        startTimer();
                    } else {
                        // 回答时间结束
                        alert('时间到！');
                    }
                }
            }, 1000);
        }

        function resetTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            timerMode = 'prep';
            timerSeconds = 30;
            document.getElementById('timerLabel').textContent = '准备时间';
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timerSeconds / 60);
            const seconds = timerSeconds % 60;
            const display = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            const timerDisplay = document.getElementById('timerDisplay');
            timerDisplay.textContent = display;

            if (timerSeconds <= 10) {
                timerDisplay.classList.add('warning');
            } else {
                timerDisplay.classList.remove('warning');
            }
        }

        // ========== 录音功能 ==========
        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const label = document.getElementById('recordLabel');

            if (mediaRecorder && mediaRecorder.state === 'recording') {
                // 停止录音
                mediaRecorder.stop();
                btn.classList.remove('recording');
                label.textContent = '正在保存录音...';
            } else {
                // 开始录音
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(stream);

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);

                        const playerContainer = document.getElementById('audioPlayerContainer');
                        playerContainer.innerHTML = `
                            <audio controls src="${audioUrl}"></audio>
                            <button class="timer-button secondary" onclick="resetRecording()" style="margin-top: 12px;">重新录音</button>
                        `;
                        label.textContent = '录音完成，可回放';

                        // 停止所有音轨
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    btn.classList.add('recording');
                    label.textContent = '录音中... (点击停止)';
                } catch (err) {
                    alert('无法访问麦克风：' + err.message);
                }
            }
        }

        function resetRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
            mediaRecorder = null;
            audioChunks = [];
            audioBlob = null;
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('recordLabel').textContent = '点击开始录音';
            document.getElementById('audioPlayerContainer').innerHTML = '';
        }

        // ========== 完成关卡 ==========
        function completeQuest() {
            if (!currentQuestId) return;

            if (!completedQuests.includes(currentQuestId)) {
                completedQuests.push(currentQuestId);
                saveProgress();
            }

            alert('🎉 恭喜过关！下一关已解锁。');
            showMap();
            renderMap();
        }

        // ========== 初始化 ==========
        renderMap();
    </script>
</body>
