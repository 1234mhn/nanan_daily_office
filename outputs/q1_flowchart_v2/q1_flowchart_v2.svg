<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1900" viewBox="0 0 1000 1900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="1900" fill="#FFFFFF"/>

  <g font-family="'Noto Sans CJK SC','DejaVu Sans',sans-serif" font-size="14.5" fill="#1A1A1A" text-anchor="middle">
    <g stroke="#4A4A4A" stroke-width="1.7" fill="#FFFFFF">

      <!-- 开始 -->
      <rect x="460" y="20" width="80" height="40" rx="20" ry="20" fill="#F2F2F2"/>
      <!-- 读取数据 -->
      <rect x="245" y="90" width="510" height="46"/>
      <!-- 数据预处理 -->
      <rect x="225" y="174" width="550" height="70"/>
      <!-- 组内取中位数 -->
      <rect x="265" y="282" width="470" height="46"/>
      <!-- 熵权法 -->
      <rect x="215" y="366" width="570" height="70"/>
      <!-- 同域百分位秩 -->
      <rect x="285" y="474" width="430" height="46"/>
      <!-- 菱形判断 -->
      <polygon fill="#FFFFFF" points="500,562 610,622 500,682 390,622"/>
      <!-- 是分支：计算稳健秩评分 -->
      <rect x="635" y="732" width="310" height="70"/>
      <!-- 否分支：直接使用综合评分 S_s -->
      <rect x="55" y="732" width="310" height="70"/>
      <!-- 合并节点（汇合点） -->
      <circle cx="500" cy="856" r="5.5" fill="#4A4A4A"/>
      <!-- 输出质量评分、冲突标记结果 -->
      <rect x="265" y="896" width="470" height="70"/>
      <!-- 配比预处理 -->
      <rect x="225" y="1004" width="550" height="70"/>
      <!-- 分别构建两个模型 -->
      <rect x="215" y="1112" width="570" height="84"/>
      <!-- 独立集测试等 -->
      <rect x="215" y="1234" width="570" height="70"/>
      <!-- 输出模型指标 -->
      <rect x="215" y="1342" width="570" height="70"/>
      <!-- 结束 -->
      <rect x="460" y="1450" width="80" height="40" rx="20" ry="20" fill="#F2F2F2"/>
    </g>

    <g stroke="#4A4A4A" stroke-width="1.7" fill="none" marker-end="url(#arrow)">
      <!-- 开始 -> 读取数据 -->
      <line x1="500" y1="60" x2="500" y2="88"/>
      <!-- 读取数据 -> 数据预处理 -->
      <line x1="500" y1="136" x2="500" y2="172"/>
      <!-- 数据预处理 -> 组内取中位数 -->
      <line x1="500" y1="244" x2="500" y2="280"/>
      <!-- 组内 -> 熵权法 -->
      <line x1="500" y1="328" x2="500" y2="364"/>
      <!-- 熵权法 -> 同域百分位秩 -->
      <line x1="500" y1="436" x2="500" y2="472"/>
      <!-- 同域 -> 菱形 -->
      <line x1="500" y1="520" x2="500" y2="560"/>
      <!-- 菱形 -> 是（右下） -->
      <line x1="610" y1="622" x2="790" y2="730"/>
    </g>

    <!-- 分支箭头（含角度标签，单独画箭头以保证标签压线） -->
    <g stroke="#4A4A4A" stroke-width="1.7" fill="none">
      <line x1="610" y1="622" x2="790" y2="730" marker-end="url(#arrow)"/>
      <line x1="390" y1="622" x2="210" y2="730" marker-end="url(#arrow)"/>
    </g>

    <!-- 是/否 标签（置于支线上方，避免与箭头压字） -->
    <text x="668" y="642" font-size="14.5" fill="#1A1A1A">是</text>
    <text x="332" y="642" font-size="14.5" fill="#1A1A1A">否</text>

    <g stroke="#4A4A4A" stroke-width="1.7" fill="none" marker-end="url(#arrow)">
      <!-- 是节点 -> 汇合点 -->
      <polyline points="790,802 790,856 500,856"/>
      <!-- 否节点 -> 汇合点 -->
      <polyline points="210,802 210,856 500,856"/>
      <!-- 汇合点 -> 输出质量评分 -->
      <line x1="500" y1="856" x2="500" y2="894"/>
      <!-- 输出质量评分 -> 配比预处理 -->
      <line x1="500" y1="966" x2="500" y2="1002"/>
      <!-- 配比预处理 -> 构建模型 -->
      <line x1="500" y1="1074" x2="500" y2="1110"/>
      <!-- 构建模型 -> 独立集测试 -->
      <line x1="500" y1="1196" x2="500" y2="1232"/>
      <!-- 独立集测试 -> 输出模型指标 -->
      <line x1="500" y1="1304" x2="500" y2="1340"/>
      <!-- 输出模型指标 -> 结束 -->
      <line x1="500" y1="1412" x2="500" y2="1448"/>
    </g>

    <!-- 节点文字 -->
    <text x="500" y="45">开始</text>

    <text x="500" y="119">读取A1-A3质量数据 &amp; A4-A15配比Loss数据</text>

    <text x="500" y="200">数据预处理：去重、指标变换、缺失异常处理、</text>
    <text x="500" y="226">22指标分为6语义组</text>

    <text x="500" y="311">组内取中位数得到6组组得分 G_sg</text>

    <text x="500" y="392">熵权法计算各组权重 w_g → 计算文本综合质量 S_s、</text>
    <text x="500" y="418">领域平均分 S_d</text>

    <text x="500" y="503">同域计算各指标百分位秩，计算冲突强度 c_s</text>

    <text x="500" y="616">c_s ≥ δ（90%分位数）?</text>

    <text x="790" y="762">计算稳健秩评分 S_s*，</text>
    <text x="790" y="788">标记冲突样本</text>
    <text x="210" y="762">直接使用综合评分 S_s</text>

    <text x="500" y="926">输出质量评分、冲突标记结果</text>

    <text x="500" y="1034">配比预处理：归一化配比满足和为1；</text>
    <text x="500" y="1060">划分训练集/测试集/外推集</text>

    <text x="500" y="1142">分别构建【和约束线性岭回归】、</text>
    <text x="500" y="1168">【二阶交互岭回归】</text>

    <text x="500" y="1264">独立集测试、配对Bootstrap显著性检验、</text>
    <text x="500" y="1290">跨尺度检验</text>

    <text x="500" y="1372">输出模型指标，确定模型适用边界</text>
    <text x="500" y="1398">（仅1M尺度有效）</text>

    <text x="500" y="1475">结束</text>

    <!-- 图注 -->
    <text x="500" y="1560" font-size="14.5" fill="#1A1A1A">图 X  问题一解题思路流程图</text>
  </g>
</svg>
