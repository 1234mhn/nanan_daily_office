<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect x="0" y="0" width="900" height="1200" fill="#FFFFFF"/>

  <!-- ================= Title ================= -->
  <text x="450" y="46" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">问题一解题思路：质量评价与领域配比建模流程</text>
  <line x1="150" y1="60" x2="750" y2="60" stroke="#4A4A4A" stroke-width="1" />

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A4A4A"/>
    </marker>
  </defs>

  <!-- Common frame style: x=150 w=600 (center 450) -->
  <!-- ================= Node 1 ================= -->
  <rect x="150" y="82" width="600" height="56" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <text x="450" y="106" text-anchor="middle" font-size="15" fill="#000000">① A1–A3 质量记录</text>
  <text x="450" y="127" text-anchor="middle" font-size="15" fill="#000000">（272505 条 / 22 项指标）</text>

  <line x1="450" y1="138" x2="450" y2="158" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ================= Node 2 ================= -->
  <rect x="150" y="158" width="600" height="66" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <text x="450" y="182" text-anchor="middle" font-size="15" fill="#000000">② 指标方向统一与机制变换</text>
  <text x="450" y="203" text-anchor="middle" font-size="14" fill="#000000">（logit差、softmax期望、ln(1+x)）</text>
  <text x="150" y="240" font-size="11" fill="#808080">注：机制变换消除量纲与方向差异，使全部指标单调同向。</text>

  <line x1="450" y1="248" x2="450" y2="268" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ================= Node 3 ================= -->
  <rect x="150" y="268" width="600" height="56" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <text x="450" y="302" text-anchor="middle" font-size="15" fill="#000000">③ Min-Max 归一化到 [0,1]</text>

  <line x1="450" y1="324" x2="450" y2="344" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ================= Node 4 ================= -->
  <rect x="150" y="344" width="600" height="66" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <text x="450" y="368" text-anchor="middle" font-size="15" fill="#000000">④ 六语义组分组 → 组内取中位数</text>
  <text x="450" y="389" text-anchor="middle" font-size="12" fill="#000000">（同组指标聚合成一个语义维度）</text>
  <text x="150" y="426" font-size="11" fill="#808080">注：语义分组提升指标可解释性，中位数抑制组内极端值影响。</text>

  <line x1="450" y1="434" x2="450" y2="454" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ================= Node 5 (key output) ================= -->
  <rect x="150" y="454" width="600" height="66" fill="#F2F2F2" stroke="#4A4A4A" stroke-width="1.8"/>
  <text x="450" y="478" text-anchor="middle" font-size="15" fill="#000000">⑤ 组间熵权 → 文本质量分 S_s</text>
  <text x="450" y="499" text-anchor="middle" font-size="15" fill="#000000">→ 领域质量分 S_d</text>
  <text x="150" y="536" font-size="11" fill="#808080">注：熵权由数据离散度客观赋权，产出质量评价主指标 S_s 与 S_d。</text>

  <line x1="450" y1="544" x2="450" y2="564" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ================= Node 6 (key output) ================= -->
  <rect x="150" y="564" width="600" height="86" fill="#F2F2F2" stroke="#4A4A4A" stroke-width="1.8"/>
  <text x="450" y="588" text-anchor="middle" font-size="15" fill="#000000">⑥ 域内百分位秩极差 → 冲突标记</text>
  <text x="450" y="609" text-anchor="middle" font-size="14" fill="#000000">（δ=0.9680，约10%）</text>
  <text x="450" y="630" text-anchor="middle" font-size="15" fill="#000000">+ 加权中位数稳健秩评分 S_s*</text>
  <text x="150" y="666" font-size="11" fill="#808080">注：极差阈值 δ 识别域内冲突样本，加权中位数秩评分给出稳健排序 S_s*。</text>

  <line x1="450" y1="674" x2="450" y2="694" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ================= Node 7 ================= -->
  <rect x="150" y="694" width="600" height="86" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.8"/>
  <text x="450" y="718" text-anchor="middle" font-size="15" fill="#000000">⑦ 领域配比模型</text>
  <text x="450" y="739" text-anchor="middle" font-size="15" fill="#000000">和约束线性模型（基线）</text>
  <text x="450" y="760" text-anchor="middle" font-size="15" fill="#000000">+ 二阶岭回归（预测）</text>
  <text x="150" y="796" font-size="11" fill="#808080">注：和约束保证配比之和为 1，二阶岭回归抑制共线性、提升预测稳定性。</text>

  <line x1="450" y1="804" x2="450" y2="824" stroke="#4A4A4A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ================= Node 8 (key output) ================= -->
  <rect x="150" y="824" width="600" height="126" fill="#F2F2F2" stroke="#4A4A4A" stroke-width="1.8"/>
  <text x="450" y="848" text-anchor="middle" font-size="15" fill="#000000">⑧ 同尺度 1M 独立检验</text>
  <text x="450" y="869" text-anchor="middle" font-size="14" fill="#000000">（R² 0.3215→0.5392）+ 配对 Bootstrap</text>
  <text x="450" y="894" text-anchor="middle" font-size="15" fill="#000000">跨尺度 1B 诊断 R²=-8.6627</text>
  <text x="450" y="915" text-anchor="middle" font-size="15" fill="#000000">→ 限定“参考配比邻域”适用边界</text>
  <text x="150" y="966" font-size="11" fill="#808080">注：同尺度独立检验验证模型有效性；跨尺度诊断揭示尺度外推失效，</text>
  <text x="150" y="982" font-size="11" fill="#808080">故配比结论仅在“参考配比邻域”内适用。</text>

  <!-- ================= Legend / caption ================= -->
  <line x1="150" y1="1040" x2="750" y2="1040" stroke="#4A4A4A" stroke-width="1"/>
  <rect x="150" y="1060" width="22" height="16" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.5"/>
  <text x="182" y="1073" font-size="12" fill="#000000">主链计算环节</text>
  <rect x="330" y="1060" width="22" height="16" fill="#F2F2F2" stroke="#4A4A4A" stroke-width="1.5"/>
  <text x="362" y="1073" font-size="12" fill="#000000">关键输出 / 结论</text>

  <text x="450" y="1120" text-anchor="middle" font-size="14" fill="#000000">图 X  问题一解题思路：质量评价与领域配比建模流程</text>
</svg>
