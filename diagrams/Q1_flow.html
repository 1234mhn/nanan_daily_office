<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>问题一 建模思路流程图</title>
<style>
  body { margin:0; background:#ffffff; color:#000000;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  main { max-width: 1500px; margin: 20px auto; padding: 0 16px; }
  svg { width:100%; height:auto; display:block; background:#fff; }
  text { fill:#000; }
  .node { fill:#ffffff; stroke:#000; stroke-width:0.9; }
  .nodeThick { fill:#ffffff; stroke:#000; stroke-width:1.6; }
  .hdr { font-size:18px; font-weight:600; }
  .hdrS { font-size:14px; font-weight:600; }
  .cap { font-size:12px; fill:#333; }
  .body { font-size:14px; }
  .edge { stroke:#000; stroke-width:1.3; fill:none; }
  .edgeThin { stroke:#000; stroke-width:0.8; fill:none; }
  .dash { stroke:#000; stroke-width:1; fill:none; stroke-dasharray:6 5; }
  .ctr { text-anchor: middle; }
</style>
<main>
<svg viewBox="0 0 1480 1120" role="img" aria-label="问题一整体建模思路流程图">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#000" />
    </marker>
  </defs>

  <!-- ================= edges first ================= -->
  <!-- input -> three columns -->
  <path class="edge" d="M740,158 L740,222" marker-end="url(#a)" />
  <path class="edge" d="M300,222 L1180,222" />
  <path class="edge" d="M300,222 L300,247" marker-end="url(#a)" />
  <path class="edge" d="M740,222 L740,247" marker-end="url(#a)" />
  <path class="edge" d="M1180,222 L1180,247" marker-end="url(#a)" />

  <!-- column backs (vertical spine per column) -->
  <path class="edgeThin" d="M300,325 L300,347" marker-end="url(#a)" />
  <path class="edgeThin" d="M300,425 L300,447" marker-end="url(#a)" />
  <path class="edgeThin" d="M300,525 L300,547" marker-end="url(#a)" />
  <path class="edgeThin" d="M300,625 L300,647" marker-end="url(#a)" />
  <path class="edgeThin" d="M740,325 L740,347" marker-end="url(#a)" />
  <path class="edgeThin" d="M740,425 L740,447" marker-end="url(#a)" />
  <path class="edgeThin" d="M740,525 L740,547" marker-end="url(#a)" />
  <path class="edgeThin" d="M740,625 L740,647" marker-end="url(#a)" />
  <path class="edgeThin" d="M1180,325 L1180,347" marker-end="url(#a)" />
  <path class="edgeThin" d="M1180,425 L1180,447" marker-end="url(#a)" />
  <path class="edgeThin" d="M1180,525 L1180,547" marker-end="url(#a)" />
  <path class="edgeThin" d="M1180,625 L1180,647" marker-end="url(#a)" />

  <!-- three columns -> merge -->
  <path class="edge" d="M300,745 L300,828" marker-end="url(#a)" />
  <path class="edge" d="M740,745 L740,828" marker-end="url(#a)" />
  <path class="edge" d="M1180,745 L1180,828" marker-end="url(#a)" />
  <path class="edge" d="M300,828 L1180,828" />

  <!-- merge -> output -->
  <path class="edge" d="M740,828 L740,900" marker-end="url(#a)" />

  <!-- key coupling: S_d -> 引入Q论证 -->
  <path class="dash" d="M300,745 C300,762 1180,762 1180,745" marker-end="url(#a)" />

  <!-- ================= header band ================= -->
  <rect class="nodeThick" x="480" y="88" width="520" height="62" rx="10" />
  <text class="hdr ctr" x="740" y="127">问题一：数据质量评价 · 冲突消解 · 配比建模</text>

  <!-- ================= input ================= -->
  <rect class="node" x="560" y="165" width="360" height="80" rx="10" />
  <text class="body ctr" x="740" y="190">A1–A3 质量信号　·　A4–A15 配方实验</text>
  <text class="body ctr" x="740" y="213">A16 跨体系映射</text>
  <text class="cap ctr" x="740" y="236">数据输入</text>

  <!-- ================= column 1 ================= -->
  <rect class="nodeThick" x="160" y="250" width="280" height="75" rx="10" />
  <text class="hdrS ctr" x="300" y="282">① 质量评价</text>
  <text class="cap ctr" x="300" y="306">合成质量分 Q</text>

  <rect class="node" x="160" y="347" width="280" height="78" rx="8" />
  <text class="body ctr" x="300" y="382">预处理：多维指标压标量</text>

  <rect class="node" x="160" y="447" width="280" height="78" rx="8" />
  <text class="body ctr" x="300" y="475">方向统一</text>
  <text class="cap ctr" x="300" y="498">负向 Min-Max 后取 1−x</text>

  <rect class="node" x="160" y="547" width="280" height="78" rx="8" />
  <text class="body ctr" x="300" y="575">分组熵权合成</text>
  <text class="cap ctr" x="300" y="598">22 指标归 6 组</text>

  <rect class="node" x="160" y="647" width="280" height="98" rx="8" />
  <text class="body ctr" x="300" y="675">聚合出领域级 S_d</text>
  <text class="cap ctr" x="300" y="698">域内均值 + bootstrap</text>
  <text class="cap ctr" x="300" y="720">稳健性核验</text>

  <!-- ================= column 2 ================= -->
  <rect class="nodeThick" x="600" y="250" width="280" height="75" rx="10" />
  <text class="hdrS ctr" x="740" y="282">② 冲突消解</text>
  <text class="cap ctr" x="740" y="306">指标打架时定规矩</text>

  <rect class="node" x="600" y="347" width="280" height="78" rx="8" />
  <text class="body ctr" x="740" y="375">定义冲突</text>
  <text class="cap ctr" x="740" y="398">最大秩差超 90% 分位</text>

  <rect class="node" x="600" y="447" width="280" height="78" rx="8" />
  <text class="body ctr" x="740" y="475">识别强冲突样本</text>
  <text class="cap ctr" x="740" y="498">约占 10%</text>

  <rect class="node" x="600" y="547" width="280" height="78" rx="8" />
  <text class="body ctr" x="740" y="575">分析成因</text>
  <text class="cap ctr" x="740" y="598">口径 / 长文 / 域适用性</text>

  <rect class="node" x="600" y="647" width="280" height="98" rx="8" />
  <text class="body ctr" x="740" y="675">加权中位数消解</text>
  <text class="cap ctr" x="740" y="698">扩展集固定阈值复检</text>
  <text class="cap ctr" x="740" y="720">产出冲突标记 + S_star</text>

  <!-- ================= column 3 ================= -->
  <rect class="nodeThick" x="1040" y="250" width="280" height="75" rx="10" />
  <text class="hdrS ctr" x="1180" y="282">③ 配比建模</text>
  <text class="cap ctr" x="1180" y="306">17 域配比 p → Loss</text>

  <rect class="node" x="1040" y="347" width="280" height="78" rx="8" />
  <text class="body ctr" x="1180" y="375">单纯形约束</text>
  <text class="cap ctr" x="1180" y="398">pᵢ≥0，Σpᵢ=1</text>

  <rect class="node" x="1040" y="447" width="280" height="78" rx="8" />
  <text class="body ctr" x="1180" y="475">线性 + 二阶模型</text>
  <text class="cap ctr" x="1180" y="498">刻画 p 与 Loss 关系</text>

  <rect class="node" x="1040" y="547" width="280" height="78" rx="8" />
  <text class="body ctr" x="1180" y="575">系数和为零估参</text>
  <text class="cap ctr" x="1180" y="598">处理共线性</text>

  <rect class="node" x="1040" y="647" width="280" height="98" rx="8" />
  <text class="body ctr" x="1180" y="675">引入 Q 论证 + 检验外推</text>
  <text class="cap ctr" x="1180" y="698">A6–A11 验证</text>
  <text class="cap ctr" x="1180" y="720">A12–A15 外推稳健性</text>

  <!-- coupling label -->
  <rect class="node" x="596" y="688" width="288" height="0" rx="0" />
  <rect class="node" x="600" y="778" width="280" height="26" rx="6" />
  <text class="cap ctr" x="740" y="796">质量是否影响配比收益</text>

  <!-- ================= output ================= -->
  <rect class="nodeThick" x="520" y="900" width="440" height="90" rx="10" />
  <text class="hdrS ctr" x="740" y="934">输出</text>
  <text class="body ctr" x="740" y="960">质量分 Q  +  配比函数 p</text>
  <text class="cap ctr" x="740" y="981">→ 交给问题二（广义标度律）</text>

  <text class="cap" x="60" y="1060">实线：主流程　　细线：组内步骤　　虚线：跨支线耦合</text>
</svg>
</main>
