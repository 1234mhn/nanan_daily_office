<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>问题一 建模思路流程图</title>
<style>
  body { margin:0; background:#fff; color:#000;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  main { max-width: 1560px; margin: 18px auto; padding: 0 14px; }
  svg { width:100%; height:auto; display:block; background:#fff; }
  text { fill:#000; }
  .b { fill:#fff; stroke:#000; stroke-width:0.9; }
  .bMain { fill:#fff; stroke:#000; stroke-width:1.3; }
  .bTitle { fill:#fff; stroke:#000; stroke-width:1.3; }
  .ctr { text-anchor: middle; }
  .t1 { font-size:15px; font-weight:700; }
  .t2 { font-size:14px; }
  .t3 { font-size:12px; fill:#333; }
  .e  { stroke:#000; stroke-width:1.3; fill:none; }
  .e2 { stroke:#000; stroke-width:0.8; fill:none; }
  .d  { stroke:#000; stroke-width:0.9; fill:none; stroke-dasharray:6 5; }
</style>
<main>
<svg viewBox="0 0 1400 1000" role="img" aria-label="问题一建模思路流程图">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#000"/>
    </marker>
  </defs>

  <!-- ===== edges: input -> horizontal bus -> 3 columns ===== -->
  <path class="e" d="M700,132 L700,168" marker-end="url(#a)"/>
  <path class="e" d="M240,168 L1160,168"/>
  <path class="e" d="M240,168 L240,196" marker-end="url(#a)"/>
  <path class="e" d="M700,168 L700,196" marker-end="url(#a)"/>
  <path class="e" d="M1160,168 L1160,196" marker-end="url(#a)"/>

  <!-- inside columns -->
  <path class="e2" d="M240,268 L240,318" marker-end="url(#a)"/>
  <path class="e2" d="M240,414 L240,444" marker-end="url(#a)"/>
  <path class="e2" d="M240,540 L240,570" marker-end="url(#a)"/>
  <path class="e2" d="M700,268 L700,318" marker-end="url(#a)"/>
  <path class="e2" d="M700,414 L700,444" marker-end="url(#a)"/>
  <path class="e2" d="M700,540 L700,570" marker-end="url(#a)"/>
  <path class="e2" d="M1160,268 L1160,318" marker-end="url(#a)"/>
  <path class="e2" d="M1160,414 L1160,444" marker-end="url(#a)"/>
  <path class="e2" d="M1160,540 L1160,570" marker-end="url(#a)"/>

  <!-- columns -> output bus -->
  <path class="e" d="M240,666 L240,700" marker-end="url(#a)"/>
  <path class="e" d="M700,666 L700,700" marker-end="url(#a)"/>
  <path class="e" d="M1160,666 L1160,700" marker-end="url(#a)"/>
  <path class="e" d="M240,700 L1160,700"/>
  <path class="e" d="M700,700 L700,760" marker-end="url(#a)"/>

  <!-- coupling dashed line -->
  <path class="d" d="M240,618 C240,700 1160,700 1160,618" marker-end="url(#a)"/>

  <!-- ===== L1 input ===== -->
  <rect class="bMain" x="470" y="66" width="460" height="66" rx="8"/>
  <text class="t1 ctr" x="700" y="94">数据输入</text>
  <text class="t2 ctr" x="700" y="118">A1–A3 质量信号 ｜ A4–A15 配方实验 ｜ A16 映射</text>

  <!-- ===== L2 column titles ===== -->
  <rect class="bTitle" x="120" y="196" width="240" height="72" rx="8"/>
  <text class="t1 ctr" x="240" y="226">① 质量评价</text>
  <text class="t3 ctr" x="240" y="250">产出：质量分 Q</text>

  <rect class="bTitle" x="580" y="196" width="240" height="72" rx="8"/>
  <text class="t1 ctr" x="700" y="226">② 冲突消解</text>
  <text class="t3 ctr" x="700" y="250">产出：冲突标记</text>

  <rect class="bTitle" x="1040" y="196" width="240" height="72" rx="8"/>
  <text class="t1 ctr" x="1160" y="226">③ 配比建模</text>
  <text class="t3 ctr" x="1160" y="250">产出：配比 p</text>

  <!-- ===== L3 nodes (3 per column) ===== -->
  <rect class="b" x="120" y="318" width="240" height="96" rx="6"/>
  <text class="t2 ctr" x="240" y="346">预处理 · 方向统一</text>
  <text class="t3 ctr" x="240" y="368">多维压标量</text>
  <text class="t3 ctr" x="240" y="388">负向 Min-Max 后取 1−x</text>

  <rect class="b" x="120" y="444" width="240" height="96" rx="6"/>
  <text class="t2 ctr" x="240" y="472">分组熵权合成</text>
  <text class="t3 ctr" x="240" y="494">22 指标归 6 组</text>
  <text class="t3 ctr" x="240" y="514">组内中位数 · 组间熵权</text>

  <rect class="b" x="580" y="318" width="240" height="96" rx="6"/>
  <text class="t2 ctr" x="700" y="346">定义冲突 · 识别样本</text>
  <text class="t3 ctr" x="700" y="368">最大秩差超 90% 分位</text>
  <text class="t3 ctr" x="700" y="388">强冲突约占 10%</text>

  <rect class="b" x="580" y="444" width="240" height="96" rx="6"/>
  <text class="t2 ctr" x="700" y="472">分析成因</text>
  <text class="t3 ctr" x="700" y="494">口径 / 长文失真</text>
  <text class="t3 ctr" x="700" y="514">/ 领域适用性差异</text>

  <rect class="b" x="1040" y="318" width="240" height="96" rx="6"/>
  <text class="t2 ctr" x="1160" y="346">单纯形约束</text>
  <text class="t3 ctr" x="1160" y="368">pᵢ ≥ 0，Σpᵢ = 1</text>

  <rect class="b" x="1040" y="444" width="240" height="96" rx="6"/>
  <text class="t2 ctr" x="1160" y="472">线性 + 二阶模型</text>
  <text class="t3 ctr" x="1160" y="494">系数和为零估参</text>
  <text class="t3 ctr" x="1160" y="514">刻画 p 与 Loss 关系</text>

  <!-- ===== bottom of columns: 3rd node (aligned row) ===== -->
  <rect class="b" x="120" y="570" width="240" height="96" rx="6"/>
  <text class="t2 ctr" x="240" y="598">领域级 S_d + 稳健核验</text>
  <text class="t3 ctr" x="240" y="620">域内均值 + bootstrap</text>
  <text class="t3 ctr" x="240" y="640">原文选例校核</text>

  <rect class="b" x="580" y="570" width="240" height="96" rx="6"/>
  <text class="t2 ctr" x="700" y="598">稳健消解 + 扩展复检</text>
  <text class="t3 ctr" x="700" y="620">加权中位数降极端影响</text>
  <text class="t3 ctr" x="700" y="640">A1 固定阈值复检</text>

  <rect class="b" x="1040" y="570" width="240" height="96" rx="6"/>
  <text class="t2 ctr" x="1160" y="598">引入 Q 论证 + 检验外推</text>
  <text class="t3 ctr" x="1160" y="620">A6–A11 验证</text>
  <text class="t3 ctr" x="1160" y="640">A12–A15 外推稳健性</text>

  <!-- ===== coupling label ===== -->
  <rect class="b" x="580" y="646" width="240" height="0" rx="6"/>
  <text class="t3 ctr" x="700" y="694">质量是否影响配比收益</text>

  <!-- ===== L4 output ===== -->
  <rect class="bMain" x="460" y="760" width="480" height="86" rx="8"/>
  <text class="t1 ctr" x="700" y="790">输出</text>
  <text class="t2 ctr" x="700" y="815">质量分 Q  +  配比函数 p</text>
  <text class="t3 ctr" x="700" y="835">→ 交给问题二（广义标度律）</text>

  <text class="t3" x="60" y="968">粗实线：主流程　　细实线：支线内步骤　　虚线：跨支线耦合（S_d → 引入 Q）</text>
</svg>
</main>
