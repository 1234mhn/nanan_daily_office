<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>问题一 思维导图 — 数据质量评价、质量冲突消解与领域配比建模</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc; --fg: #172033; --muted: #5b6475; --line: #64748b;
    --neutral: #e2e8f0; --input: #bfdbfe; --process: #c7d2fe;
    --storage: #99f6e4; --external: #fde68a; --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --fg: #e5e7eb; --muted: #a3adbd; --line: #94a3b8;
      --neutral: #334155; --input: #1d4ed8; --process: #4338ca;
      --storage: #0f766e; --external: #92400e; --risk: #991b1b;
    }
  }
  body { margin:0; background:var(--bg); color:var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 1560px; margin: 24px auto; padding: 0 16px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 21px; font-weight: 700; fill: var(--fg); }
  .label { font-size: 14px; font-weight: 600; fill: var(--fg); }
  .labellg { font-size: 15px; font-weight: 700; fill: var(--fg); }
  .small { font-size: 12px; fill: var(--fg); }
  .tiny { font-size: 11px; fill: var(--fg); }
  .node { stroke: var(--line); stroke-width: 1; }
  .neutral { fill: var(--neutral); } .input { fill: var(--input); }
  .process { fill: var(--process); } .storage { fill: var(--storage); }
  .external { fill: var(--external); } .risk { fill: var(--risk); }
  .edge { stroke: var(--line); stroke-width: 1.8; fill: none; }
  .edge-thin { stroke: var(--line); stroke-width: 1.2; fill: none; opacity: 0.7; }
  .zone { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 8 6; opacity: 0.85; }
</style>
<main>
<svg viewBox="0 0 1560 1200" role="img" aria-label="问题一思维导图">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- ============ connectors (drawn first) ============ -->
  <path class="edge" d="M400,150 L500,150" marker-end="url(#arr)" />
  <path class="edge" d="M400,150 C450,150 450,400 500,400" marker-end="url(#arr)" />
  <path class="edge" d="M400,150 C450,150 450,650 500,650" marker-end="url(#arr)" />

  <!-- branch 1 fan-out (5 leaves) -->
  <path class="edge-thin" d="M760,120 L880,90" marker-end="url(#arr)" />
  <path class="edge-thin" d="M760,140 L880,160" marker-end="url(#arr)" />
  <path class="edge-thin" d="M760,160 L880,230" marker-end="url(#arr)" />
  <path class="edge-thin" d="M760,180 L880,300" marker-end="url(#arr)" />
  <path class="edge-thin" d="M760,196 L880,375" marker-end="url(#arr)" />

  <!-- branch 2 fan-out (4 leaves) -->
  <path class="edge-thin" d="M760,370 L880,320" marker-end="url(#arr)" />
  <path class="edge-thin" d="M760,390 L880,395" marker-end="url(#arr)" />
  <path class="edge-thin" d="M760,410 L880,470" marker-end="url(#arr)" />
  <path class="edge-thin" d="M760,426 L880,545" marker-end="url(#arr)" />

  <!-- branch 3 fan-out (4 leaves) -->
  <path class="edge-thin" d="M760,620 L880,600" marker-end="url(#arr)" />
  <path class="edge-thin" d="M760,640 L880,675" marker-end="url(#arr)" />
  <path class="edge-thin" d="M760,660 L880,750" marker-end="url(#arr)" />
  <path class="edge-thin" d="M760,676 L880,825" marker-end="url(#arr)" />

  <!-- to checklist -->
  <path class="edge" d="M920,400 C920,880 900,880 900,905" marker-end="url(#arr)" />
  <path class="edge" d="M920,650 C920,880 900,880 900,905" marker-end="url(#arr)" />

  <!-- checklist to outputs -->
  <path class="edge" d="M1215,940 L1300,940" marker-end="url(#arr)" />
  <path class="edge" d="M1215,1000 L1300,1000" marker-end="url(#arr)" />
  <path class="edge" d="M1215,1060 L1300,1060" marker-end="url(#arr)" />

  <!-- ============ ROOT ============ -->
  <rect class="node neutral" x="30" y="85" width="370" height="130" rx="14" />
  <text class="title" x="54" y="122">问题一 · 数据质量评价、</text>
  <text class="title" x="54" y="150">质量冲突消解与领域配比建模</text>
  <text class="small" x="54" y="178">输入：A1–A3 质量信号 · A4–A15 配方实验</text>
  <text class="small" x="54" y="198">输出：质量分 Q + 配比 p → 传给问题二</text>

  <!-- ============ ① ============ -->
  <rect class="node input" x="500" y="86" width="260" height="70" rx="12" />
  <text class="labellg" x="522" y="116">① 数据质量评价</text>
  <text class="small" x="522" y="139">22 个指标合成质量分 Q</text>

  <rect class="node external" x="880" y="62" width="270" height="58" rx="10" />
  <text class="label" x="898" y="86">方向统一：越高越好</text>
  <text class="tiny" x="898" y="105">正向直用；负向 Min-Max 后取 1−x</text>

  <rect class="node external" x="880" y="132" width="270" height="58" rx="10" />
  <text class="label" x="898" y="156">多维列表指标先压标量</text>
  <text class="tiny" x="898" y="175">均值 / PCA 压缩，再做归一化</text>

  <rect class="node process" x="880" y="202" width="270" height="58" rx="10" />
  <text class="label" x="898" y="226">综合评价模型</text>
  <text class="tiny" x="898" y="245">熵权法 / PCA / AHP 确定权重</text>

  <rect class="node storage" x="880" y="268" width="270" height="56" rx="10" />
  <text class="label" x="898" y="291">聚合：样本→语料→领域</text>
  <text class="tiny" x="898" y="310">给出领域级 Q（加权/分层聚合）</text>

  <rect class="node risk" x="880" y="332" width="270" height="64" rx="10" />
  <text class="label" x="898" y="354">硬性要求</text>
  <text class="tiny" x="898" y="372">必须用 A1+A2+A3 全部记录</text>
  <text class="tiny" x="898" y="388">领域级 Q 须与抽样集结果对照</text>

  <!-- ============ ② ============ -->
  <rect class="node input" x="500" y="366" width="260" height="70" rx="12" />
  <text class="labellg" x="522" y="396">② 质量冲突消解</text>
  <text class="small" x="522" y="419">不同指标给出矛盾评价时</text>

  <rect class="node external" x="880" y="412" width="270" height="56" rx="10" />
  <text class="label" x="898" y="435">定义「冲突」</text>
  <text class="tiny" x="898" y="454">标准化差超阈值 / 显著负相关</text>

  <rect class="node external" x="880" y="478" width="270" height="56" rx="10" />
  <text class="label" x="898" y="501">分析成因</text>
  <text class="tiny" x="898" y="520">标注口径不同 / 长文失真 / 域差异</text>

  <rect class="node process" x="880" y="544" width="270" height="56" rx="10" />
  <text class="label" x="898" y="567">消解规则</text>
  <text class="tiny" x="898" y="586">降权 / 剔除 / 分段 / 多目标处理</text>

  <rect class="node storage" x="880" y="610" width="270" height="56" rx="10" />
  <text class="label" x="898" y="633">覆盖范围</text>
  <text class="tiny" x="898" y="652">抽样集分析 + 扩展集结论复核</text>

  <!-- ============ ③ ============ -->
  <rect class="node input" x="500" y="616" width="260" height="70" rx="12" />
  <text class="labellg" x="522" y="646">③ 领域配比建模</text>
  <text class="small" x="522" y="669">17 域配比 p → 交叉熵 Loss</text>

  <rect class="node external" x="880" y="676" width="270" height="56" rx="10" />
  <text class="label" x="898" y="699">单纯形约束处理</text>
  <text class="tiny" x="898" y="718">pᵢ≥0, Σpᵢ=1 → ILR/CLR 或 softmax</text>

  <rect class="node process" x="880" y="742" width="270" height="56" rx="10" />
  <text class="label" x="898" y="765">配比→Loss 定量关系</text>
  <text class="tiny" x="898" y="784">回归 + 单领域及组合影响分析</text>

  <rect class="node process" x="880" y="808" width="270" height="56" rx="10" />
  <text class="label" x="898" y="831">是否引入质量 Q</text>
  <text class="tiny" x="898" y="850">跨体系映射（参考 A16）须论证</text>

  <rect class="node risk" x="880" y="874" width="270" height="64" rx="10" />
  <text class="label" x="898" y="896">验证与外推</text>
  <text class="tiny" x="898" y="914">A6–A11 检验集上验证模型</text>
  <text class="tiny" x="898" y="930">A12–A15 外推稳健性（成对使用）</text>

  <!-- ============ 自检清单 ============ -->
  <rect class="zone" x="30" y="900" width="1185" height="180" rx="16" />
  <text class="labellg" x="56" y="932">自检清单（做错就丢分）</text>

  <rect class="node risk" x="56" y="948" width="360" height="52" rx="10" />
  <text class="tiny" x="74" y="969">指标方向忘了统一：Min-Max 极值须取自全数据集</text>
  <text class="tiny" x="74" y="987">（不能按样本分别取极值）</text>

  <rect class="node risk" x="436" y="948" width="360" height="52" rx="10" />
  <text class="tiny" x="454" y="969">单纯形约束被忽略：不能直接跑普通 OLS</text>
  <text class="tiny" x="454" y="987">须做 ILR/CLR 变换或带约束优化</text>

  <rect class="node risk" x="816" y="948" width="375" height="52" rx="10" />
  <text class="tiny" x="834" y="969">只做样本级 Q：缺少领域级 Q 及其与抽样集对照</text>
  <text class="tiny" x="834" y="987">外推时配比表与 Loss 表必须成对使用</text>

  <rect class="node neutral" x="56" y="1012" width="360" height="50" rx="10" />
  <text class="tiny" x="74" y="1033">质量评分自检：用原始教材内容验证评分可靠性</text>
  <text class="tiny" x="74" y="1051">（可选用 A18 做验算）</text>

  <rect class="node neutral" x="436" y="1012" width="360" height="50" rx="10" />
  <text class="tiny" x="454" y="1033">冲突结论须在扩展集上复核是否同样成立</text>

  <rect class="node neutral" x="816" y="1012" width="375" height="50" rx="10" />
  <text class="tiny" x="834" y="1033">预处理、模型形式、评价指标均须自行论证依据</text>

  <!-- ============ 下游输出 ============ -->
  <rect class="node storage" x="1300" y="912" width="230" height="58" rx="10" />
  <text class="label" x="1318" y="936">质量分 Q</text>
  <text class="tiny" x="1318" y="955">→ 问题二 / 三 的输入</text>

  <rect class="node storage" x="1300" y="972" width="230" height="58" rx="10" />
  <text class="label" x="1318" y="996">配比 p</text>
  <text class="tiny" x="1318" y="1015">→ 问题二 / 三 的输入</text>

  <rect class="node neutral" x="1300" y="1032" width="230" height="58" rx="10" />
  <text class="label" x="1318" y="1056">广义标度律</text>
  <text class="tiny" x="1318" y="1075">问题二在此基础上继续</text>
</svg>
</main>
